name: Quality checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: Compile and collect tests
    runs-on: ubuntu-latest

    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-test.txt

      - name: Instalar dependencias
        run: python -m pip install -r requirements-test.txt

      - name: Validar sintaxis Python
        run: python -m compileall -q app scripts tests

      - name: Validar dependencias instaladas
        run: python -m pip check

      - name: Validar recolección de pruebas
        run: python -m pytest --collect-only -q
